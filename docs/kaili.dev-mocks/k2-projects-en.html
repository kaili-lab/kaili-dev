<script src="personal-data-en.js"></script>
<script>
  document.getElementById("projects").innerHTML = made.map(p => `
    <li>
      <div class="thumb"><img src="img/${p.img}.png" alt="${p.name} home page"></div>
      <div>
        <div class="name"><b>${p.name}</b><em class="pill ${p.status === "Maintained" ? "on" : ""}">${p.status}</em></div>
        <p class="why">${p.why}</p>
        <p class="intro">${p.intro}</p>
        <div class="links"><a class="ext" href="#">${p.url} ↗</a><a class="ext" href="#">${p.repo} ↗</a></div>
      </div>
    </li>`).join("");
</script>
